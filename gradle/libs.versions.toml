# ============================================================================
# BLOQUE 1: VERSIONES DE LIBRERÍAS Y PLUGINS
# Centraliza las versiones de Android, Kotlin, Jetpack Compose y Firebase
# para mantener todo el proyecto sincronizado y fácil de revisar.
# ============================================================================
[versions]
agp = "9.5.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.0"
composeBom = "2026.02.01"
googleGmsGoogleServices = "4.6.0"
firebaseAuth = "23.1.0"
credentials = "1.6.0"
credentialsPlayServicesAuth = "1.6.0"
googleid = "1.2.1"

# Versión compatible de Cloud Firestore para la base de datos en la nube
firebaseFirestore = "25.1.4"

# ============================================================================
# BLOQUE 2: DEFINICIÓN DE LIBRERÍAS
# Aquí se declaran las dependencias que luego se llaman desde app/build.gradle.kts.
# ============================================================================
[libraries]

# Librería para conectar con la base de datos en la nube Cloud Firestore
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebaseFirestore" }

# Core y ciclo de vida de Android / Compose
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Bill of Materials (BOM) de Jetpack Compose y componentes UI / Material 3
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Runtime explícito de Compose para resolver tipos internos como ComposableFunction0/1/2
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Íconos extendidos de Material (incluye Icons.Default.Schedule, entre otros)
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Autenticación de Firebase y credenciales de Google
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentialsPlayServicesAuth" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# ============================================================================
# BLOQUE 3: PLUGINS DE COMPILACIÓN Y SERVICIOS
# Activa el plugin de Android, el compilador de Compose para Kotlin y Google Services.
# ============================================================================
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }